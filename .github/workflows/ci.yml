---
name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/fculpo/azuracast_api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/fculpo/azuracast_api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core pytest

      - name: Run unit tests
        run: pytest -q

      - name: Run Ansible sanity tests
        run: ansible-test sanity --python 3.12

      - name: Build collection artifact
        run: ansible-galaxy collection build . --output-path dist --force
