---
- name: Create generated state directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../generated"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Fetch API discovery resources
  ansible.builtin.uri:
    url: "{{ azuracast_api_base_url }}{{ item.path }}"
    method: GET
    headers: "{{ azuracast_api_headers }}"
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
    return_content: true
    status_code: [200]
  loop:
    - name: settings
      path: /api/admin/settings
    - name: storage_locations
      path: /api/admin/storage_locations
    - name: stations
      path: /api/admin/stations
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"
  register: azuracast_discovery_responses

- name: Write sanitized discovery export
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../generated/api-discovery.json"
    mode: "0640"
    content: "{{ export_payload | to_nice_json }}\n"
  vars:
    export_payload:
      base_url: "{{ azuracast_api_base_url }}"
      resources: "{{ azuracast_discovery_responses.results | map(attribute='json') | list | fculpo.azuracast_api.azuracast_redact }}"
  delegate_to: localhost
  become: false
  check_mode: false
