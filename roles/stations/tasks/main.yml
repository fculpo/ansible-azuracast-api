---
- name: Fetch current AzuraCast stations
  ansible.builtin.uri:
    url: "{{ azuracast_api_base_url }}/api/admin/stations"
    method: GET
    headers: "{{ azuracast_api_headers }}"
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
    return_content: true
    status_code: [200]
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"
  register: azuracast_stations_live_response

- name: Fetch current AzuraCast storage locations for station references
  ansible.builtin.uri:
    url: "{{ azuracast_api_base_url }}/api/admin/storage_locations"
    method: GET
    headers: "{{ azuracast_api_headers }}"
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
    return_content: true
    status_code: [200]
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"
  register: azuracast_stations_storage_live_response

- name: Resolve station storage references
  ansible.builtin.set_fact:
    azuracast_stations_resolved: "{{ azuracast_stations | fculpo.azuracast_api.azuracast_resolve_storage_references(azuracast_stations_storage_live_response.json) }}"

- name: Plan station actions
  ansible.builtin.set_fact:
    azuracast_stations_plan: "{{ azuracast_stations_resolved | fculpo.azuracast_api.azuracast_station_api_payloads | fculpo.azuracast_api.azuracast_plan_actions(azuracast_stations_live_response.json, 'short_name') }}"

- name: Report station plan
  ansible.builtin.debug:
    msg:
      resource: stations
      create: "{{ azuracast_stations_plan['create'] | fculpo.azuracast_api.azuracast_redact }}"
      update: "{{ azuracast_stations_plan['update'] | fculpo.azuracast_api.azuracast_redact }}"
      unmanaged: "{{ azuracast_stations_plan['unmanaged'] | fculpo.azuracast_api.azuracast_redact }}"

- name: Create missing stations
  fculpo.azuracast_api.station:
    base_url: "{{ azuracast_api_base_url }}"
    api_key: "{{ azuracast_api_key }}"
    short_name: "{{ item.short_name }}"
    resource: "{{ item }}"
    state: present
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
  loop: "{{ azuracast_stations_plan['create'] }}"
  loop_control:
    label: "{{ item.short_name }}"
  delegate_to: localhost
  become: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"

- name: Update changed stations
  fculpo.azuracast_api.station:
    base_url: "{{ azuracast_api_base_url }}"
    api_key: "{{ azuracast_api_key }}"
    short_name: "{{ item.key }}"
    resource: "{{ item.after }}"
    state: present
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
  loop: "{{ azuracast_stations_plan['update'] }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"

- name: Delete unmanaged stations only when explicitly allowed
  fculpo.azuracast_api.station:
    base_url: "{{ azuracast_api_base_url }}"
    api_key: "{{ azuracast_api_key }}"
    short_name: "{{ item.short_name }}"
    state: absent
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
  loop: "{{ azuracast_stations_plan | fculpo.azuracast_api.azuracast_destructive_deletes(azuracast_destructive_sync, azuracast_destructive_allow, 'stations') }}"
  loop_control:
    label: "{{ item.short_name }}"
  delegate_to: localhost
  become: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"
