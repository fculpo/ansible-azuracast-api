    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
  loop: "{{ azuracast_station_resource_plans | selectattr('family', 'equalto', 'webhooks') | list | subelements('create') }}"
  loop_control:
    label: "{{ item.0.station }} {{ item.1.name }}"
  delegate_to: localhost
  become: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"

- name: Update changed station mounts
  fculpo.azuracast_api.station_mount:
    base_url: "{{ azuracast_api_base_url }}"
    api_key: "{{ azuracast_api_key }}"
    station_short_name: "{{ item.0.station }}"
    name: "{{ item.1.key }}"
    resource: "{{ item.1.after }}"
    state: present
    validate_certs: "{{ azuracast_api.validate_certs | default(true) }}"
    timeout: "{{ azuracast_api.timeout | default(30) }}"
  loop: "{{ azuracast_station_resource_plans | selectattr('family', 'equalto', 'mounts') | list | subelements('update') }}"
  loop_control:
    label: "{{ item.0.station }} {{ item.1.key }}"
  delegate_to: localhost
  become: false
  no_log: "{{ azuracast_api_hide_sensitive_logs }}"

